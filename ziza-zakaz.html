<title>Зиза — Заказ товара</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f3f5,#0b0b0d);--card:light-dark(#fff,#151518);--card2:light-dark(#f7f7f9,#1c1c21);--ink:light-dark(#111114,#f2f2f4);--mute:light-dark(#6b6b76,#9b9ba6);--line:light-dark(#e6e6eb,#2a2a31);--red:light-dark(#d0112b,#ff4257);--reds:light-dark(#fdedef,#3a151a);--ok:light-dark(#11804a,#4fd08c);--oks:light-dark(#e6f6ed,#11301f);--amb:light-dark(#9c5600,#f3b14e);--ambs:light-dark(#fff3df,#33260f);--shc:light-dark(rgba(17,17,20,.06),rgba(0,0,0,.55))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Onest,Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.eyebrow{font-size:13px;color:var(--mute);font-weight:500}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;min-height:100dvh}
/* меню ОС */
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.02em;padding:0 8px 24px}
.logo img{width:30px;height:30px;border-radius:9px;display:block}
.side .eyebrow{padding:0 10px 8px;font-size:12px}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;min-height:42px;font-size:14.5px;border-radius:10px;color:var(--mute)}
.nv.on{background:var(--reds);color:var(--red);font-weight:600}
button.nv{width:100%;background:none;border:0;text-align:left;color:var(--ink);font-weight:500}button.nv:hover{background:var(--card2)}button.nv.on{background:var(--reds);color:var(--red);font-weight:600}
#navDash{margin-bottom:14px}
.nv .new{font-size:11px;font-weight:600;background:var(--red);color:#fff;padding:1px 8px;border-radius:99px}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--mute)}
/* страница */
.page{padding:24px max(2.2vw,16px) 40px;max-width:1500px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(28px,3vw,36px);line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:4px 0 0}
.theme{display:inline-flex;background:var(--card2);border:1px solid var(--line);padding:3px;border-radius:12px;min-height:44px;position:relative}
.theme span{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:0 12px;min-height:36px;font-size:13.5px;font-weight:500;color:var(--mute);transition:color .25s}
.theme svg{width:15px;height:15px}
.theme::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--card);border-radius:9px;box-shadow:0 1px 3px var(--shc);transition:transform .3s ease}
.theme[aria-checked=true]::before{transform:translateX(100%)}
.theme[aria-checked=false] .d,.theme[aria-checked=true] .n{color:var(--ink)}
/* дашборд */
.dash{margin-top:16px}
.dash .dh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 2px var(--shc)}
.tile span{font-size:12.5px;color:var(--mute);line-height:1.3;min-height:33px;font-weight:500}
.tile b{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;color:var(--mute)}
.tile.r b{color:var(--red)}
.tile .bar{height:5px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}.tile .bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .6s}
.tile.r .bar i{background:var(--red)}
.tile.bump{animation:bp 1.4s ease}@keyframes bp{0%{box-shadow:0 0 0 3px var(--red)}100%{box-shadow:0 1px 2px var(--shc)}}
/* вкладки */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px var(--shc)}
.tabs{display:flex;gap:4px;padding:8px;margin:14px 14px 0;background:var(--card2);border-radius:14px;width:max-content;max-width:calc(100% - 28px);overflow-x:auto}
.tab{flex:none;background:none;border:0;padding:0 16px;min-height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mute);white-space:nowrap}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shc)}
.tab b{font-size:12px;font-weight:600;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px}
.body{padding:18px 22px 22px}
.sub{margin:4px 0 0;color:var(--mute);font-size:14.5px;max-width:72ch}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2}
/* ввод */
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin:16px 0 6px;position:relative}
.add input{width:100%;font-size:16px;padding:12px 16px;background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:52px}
.add input:focus{border-color:var(--ink);background:var(--card);outline:0}
.scanbtn{display:flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--card);padding:0 20px;min-height:52px;font-size:14.5px;font-weight:600;border-radius:12px}
.scanbtn svg{width:19px;height:19px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px var(--shc);max-height:380px;overflow:auto;padding:6px}
.sug:empty{display:none}
.opt{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;min-height:54px}
.opt:hover,.opt.hi{background:var(--card2)}
.opt b{font-weight:600;display:block}
.opt small{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.opt mark{background:var(--reds);color:var(--red);font-weight:700;border-radius:4px;padding:0 1px}
.nf{padding:10px;display:flex;flex-direction:column;gap:8px}
.nf p{margin:0;font-size:14px}
.nf .row{display:flex;gap:8px;flex-wrap:wrap}
.nf input{flex:1 1 220px;font-size:16px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;min-height:44px}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
/* строки заказа */
.grid{margin-top:14px}
.ln2{display:grid;grid-template-columns:minmax(290px,2.4fr) 84px 128px 104px 92px minmax(200px,1.6fr) 96px 30px;gap:12px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.ln2.hd{font-size:12.5px;font-weight:500;color:var(--mute);padding:6px 0;align-items:end}
.ln2.fresh{animation:fr 1.4s ease}@keyframes fr{0%{background:var(--reds)}100%{background:transparent}}
.c-name>b{font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:600;background:var(--card2);padding:1px 8px;border-radius:99px;color:var(--mute);margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.red{background:var(--reds);color:var(--red)}
.codes{margin-top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.cg{display:grid;grid-template-columns:auto auto auto;gap:3px 12px;font-size:12px;max-width:100%;font-variant-numeric:tabular-nums;background:var(--card2);border-radius:10px;padding:8px 12px}
.cg .h{font-size:11.5px;color:var(--mute);font-weight:600}
.cg .l{color:var(--mute)}
.cg .g{color:var(--ok);font-weight:600}.cg .a{color:var(--amb);font-weight:600}
.cb{font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px}
.cb.g{background:var(--oks);color:var(--ok)}.cb.a{background:var(--ambs);color:var(--amb)}
.ln2 input[type=number],.ln2 select{width:100%;font-size:15px;padding:8px 10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;min-height:42px}
.ln2 input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.ln2 small{display:block;font-size:12px;color:var(--mute);margin-top:5px;line-height:1.35}
.need .c-pk input{border-color:var(--red);background:var(--reds)}
.c-pk em{display:block;font-style:normal;font-size:12px;color:var(--red);margin-top:5px;font-weight:600}
.miss{border-color:var(--red)!important;background:var(--reds)!important}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:42px;font-size:13px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{flex:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.2s}

.tskip{background:none;border:0;color:var(--mute);text-decoration:underline;min-height:44px;font-size:13.5px}
#ring{position:fixed;z-index:62;border:3px solid var(--red);border-radius:12px;pointer-events:none;display:none;animation:pr 1.4s ease-in-out infinite}
@keyframes pr{50%{box-shadow:0 0 0 8px rgba(208,17,43,.25)}}
#ptr{position:fixed;z-index:63;display:none;flex-direction:column;align-items:center;pointer-events:none;transform:translateX(-50%)}
#ptr.up{flex-direction:column-reverse}
#ptr .lab{background:var(--red);color:#fff;font-weight:600;font-size:14px;line-height:1.3;padding:8px 12px;border-radius:10px;max-width:250px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#ptr svg{width:32px;height:38px;animation:bob 1s ease-in-out infinite}
#ptr.up svg{transform:rotate(180deg);animation-name:bobu}
@keyframes bob{50%{translate:0 6px}}@keyframes bobu{50%{translate:0 -6px}}
@media(max-width:600px){
 .tour{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));width:auto;padding:12px 14px 8px;border-radius:16px;max-height:44vh;overflow:auto}
 .tour.center{left:50%;right:auto;width:calc(100vw - 24px);max-height:80vh}
 .tour .n{font-size:12px}
 .tour h3{font-size:17px;margin:2px 0 4px}.tour p{font-size:13.5px;line-height:1.4;margin:0 0 2px}.tour .act{font-size:12.5px;min-height:0}
 .dots{margin:6px 0 4px;gap:2px}.dots i{height:3px}
 .trow .btn{min-height:42px}.tskip{min-height:42px}
 #ptr .lab{font-size:12.5px;padding:6px 10px;max-width:200px}#ptr svg{width:26px;height:30px}
}
@media print{.tour,#ring,#ptr,.dim,.blocker{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function dots(){$('tD').innerHTML=STEPS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}
async function show(i){step=i;const st=STEPS[i],my=++run;
 $('tour').classList.toggle('center',!!st.c);$('tN').textContent=`Шаг ${i+1} из ${STEPS.length}`;$('tH').textContent=st.h;$('tP').textContent=st.p;say('');dots();
 $('tNext').textContent=st.last?'Попробовать самому':'Дальше';$('tSkip').style.visibility=st.last?'hidden':'visible';
 point(null);spot(st.s||null);$('tNext').disabled=true;
 if(st.f)await st.f();if(my!==run)return;if(st.s)spot(st.s);
 await wait(st.f?500:250);if(my!==run)return;point(st.pt||null,st.l);
 await wait(st.pt?700:0);if(my!==run)return;$('tNext').disabled=false;$('tNext').focus({preventScroll:true})}
function resetAll(){closeScan();closePdf();S&&(S.drawer=null);seed();render()}
function startTour(){live=1;document.body.style.paddingBottom=phone()?'60vh':'340px';resetAll();scrollTo({top:0});$('tour').classList.add('on');$('block').classList.add('on');show(0)}
function endTour(){live=0;run++;document.body.style.paddingBottom='';point(null);spot(null);$('tour').classList.remove('on');$('block').classList.remove('on');$('dim').classList.remove('on');resetAll();scrollTo({top:0,behavior:'smooth'})}
$('tNext').onclick=()=>{if(STEPS[step].last)endTour();else show(step+1)};
$('tSkip').onclick=endTour;
$('tourAgain').onclick=()=>startTour();
applyTh();seed();render();startTour();
}
